<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%" style="background-color: #050816; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="portalGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42f56c" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="500" y="45" fill="#42f56c" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="2" filter="url(#glow)">
    RICK &amp; MORTY: DIMENSION RAID — N8N WORKFLOW
  </text>
  <text x="500" y="70" fill="#94a3b8" font-size="13" text-anchor="middle">
    Flujo de Clasificación y Recompensas Interdimensionales
  </text>

  <!-- Connecting Lines -->
  <!-- 1 -> 2 -->
  <line x1="180" y1="230" x2="260" y2="230" stroke="#42f56c" stroke-width="3" stroke-dasharray="6,4" />
  <!-- 2 -> 3 -->
  <line x1="420" y1="230" x2="500" y2="230" stroke="#22d3ee" stroke-width="3" />
  <!-- 3 -> 4 (True) -->
  <path d="M 640 200 L 700 150 L 730 150" fill="none" stroke="#42f56c" stroke-width="3" />
  <text x="670" y="165" fill="#42f56c" font-size="11" font-weight="bold">TRUE</text>
  <!-- 3 -> 5 (False) -->
  <path d="M 640 260 L 700 310 L 730 310" fill="none" stroke="#facc15" stroke-width="3" />
  <text x="670" y="300" fill="#facc15" font-size="11" font-weight="bold">FALSE</text>
  <!-- 4 -> 6 -->
  <path d="M 870 150 L 900 150 L 920 200" fill="none" stroke="#42f56c" stroke-width="3" />
  <!-- 5 -> 6 -->
  <path d="M 870 310 L 900 310 L 920 260" fill="none" stroke="#facc15" stroke-width="3" />

  <!-- Node 1: Webhook -->
  <g transform="translate(40, 170)">
    <rect width="140" height="120" rx="12" fill="#111827" stroke="#42f56c" stroke-width="2" />
    <circle cx="70" cy="35" r="18" fill="url(#portalGreenGrad)" />
    <text x="70" y="40" fill="#050816" font-size="16" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="70" y="75" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1. Webhook</text>
    <text x="70" y="95" fill="#94a3b8" font-size="10" text-anchor="middle">POST /dimension-raid</text>
  </g>

  <!-- Node 2: Validar y Normalizar -->
  <g transform="translate(260, 170)">
    <rect width="160" height="120" rx="12" fill="#111827" stroke="#22d3ee" stroke-width="2" />
    <circle cx="80" cy="35" r="18" fill="url(#cyanGrad)" />
    <text x="80" y="40" fill="#050816" font-size="16" font-weight="bold" text-anchor="middle">⚙</text>
    <text x="80" y="75" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2. Validar Datos</text>
    <text x="80" y="95" fill="#94a3b8" font-size="10" text-anchor="middle">Normalizar score/player</text>
  </g>

  <!-- Node 3: IF Condición -->
  <g transform="translate(500, 170)">
    <rect width="140" height="120" rx="12" fill="#111827" stroke="#a855f7" stroke-width="2" />
    <circle cx="70" cy="35" r="18" fill="url(#purpleGrad)" />
    <text x="70" y="40" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">⑂</text>
    <text x="70" y="75" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">3. IF Condition</text>
    <text x="70" y="95" fill="#c084fc" font-size="10" text-anchor="middle">Score &gt;= 1000</text>
  </g>

  <!-- Node 4: Dimension Master (True) -->
  <g transform="translate(730, 90)">
    <rect width="140" height="110" rx="12" fill="#111827" stroke="#42f56c" stroke-width="2" />
    <circle cx="70" cy="30" r="16" fill="url(#portalGreenGrad)" />
    <text x="70" y="35" fill="#050816" font-size="14" font-weight="bold" text-anchor="middle">🏆</text>
    <text x="70" y="65" fill="#42f56c" font-size="12" font-weight="bold" text-anchor="middle">4. MASTER</text>
    <text x="70" y="85" fill="#94a3b8" font-size="9" text-anchor="middle">S-Rank &bull; Gun Skin</text>
  </g>

  <!-- Node 5: Portal Rookie (False) -->
  <g transform="translate(730, 250)">
    <rect width="140" height="110" rx="12" fill="#111827" stroke="#facc15" stroke-width="2" />
    <circle cx="70" cy="30" r="16" fill="url(#yellowGrad)" />
    <text x="70" y="35" fill="#050816" font-size="14" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="70" y="65" fill="#facc15" font-size="12" font-weight="bold" text-anchor="middle">5. ROOKIE</text>
    <text x="70" y="85" fill="#94a3b8" font-size="9" text-anchor="middle">B-Rank &bull; Battery</text>
  </g>

  <!-- Node 6: Respond to Webhook -->
  <g transform="translate(860, 175)">
    <rect width="110" height="100" rx="12" fill="#111827" stroke="#22d3ee" stroke-width="2" />
    <circle cx="55" cy="30" r="15" fill="url(#cyanGrad)" />
    <text x="55" y="35" fill="#050816" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
    <text x="55" y="65" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">6. Response</text>
    <text x="55" y="80" fill="#94a3b8" font-size="8" text-anchor="middle">JSON 200 OK</text>
  </g>

  <!-- Bottom Note -->
  <rect x="200" y="405" width="600" height="35" rx="8" fill="rgba(17, 24, 39, 0.8)" stroke="#22d3ee" stroke-width="1" />
  <text x="500" y="427" fill="#94a3b8" font-size="11" text-anchor="middle">
    💡 Nota de entrega: Esta representación visual documenta la topología del archivo dimension-raid-score-workflow.json.
  </text>
</svg>
